version: '3.8'

services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: cab_backend_prod
    restart: unless-stopped
    environment:
      - PORT=8080
      - ENVIRONMENT=production
      - DATABASE_PATH=/app/backend/data/bookings.db
    env_file:
      - backend/.env
    volumes:
      - cab_db_data:/app/backend/data
      - cab_uploads:/app/frontend/public/assets/uploads
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "5"
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    container_name: cab_frontend_prod
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      - backend
    volumes:
      - cab_uploads:/usr/share/nginx/html/assets/uploads
      - /etc/letsencrypt:/etc/letsencrypt:ro
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "5"
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 256M

volumes:
  cab_db_data:
    driver: local
  cab_uploads:
    driver: local
