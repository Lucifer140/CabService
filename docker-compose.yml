version: '3.8'

services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: cab_backend_dev
    ports:
      - "8080:8080"
    environment:
      - PORT=8080
      - ENVIRONMENT=development
      - DATABASE_PATH=/app/backend/data/bookings.db
    volumes:
      - ./backend/data:/app/backend/data
      - ./frontend/public/assets/uploads:/app/frontend/public/assets/uploads
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    container_name: cab_frontend_dev
    ports:
      - "80:80"
    depends_on:
      - backend
    restart: unless-stopped
